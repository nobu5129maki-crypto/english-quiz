<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1f7a4d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="5分英単語">
  <meta name="description" content="中学1年生のための５分英単語。毎日5分、音から定着させる英単語学習。">
  <title>中学1年生のための５分英単語</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    :root {
      --bg: #eef3ef;
      --ink: #1c2b24;
      --muted: #5c6f66;
      --primary: #1f7a4d;
      --primary-dark: #165c3a;
      --card: #ffffff;
      --line: #d7e3db;
      --ok: #1f7a4d;
      --ng: #c0392b;
      --now: #c9a227;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .phone {
      min-height: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
    }
    h1, h2, p { margin: 0; }
    button { font-family: inherit; }
    [hidden] { display: none !important; }

    .brand {
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .title {
      font-size: 1.55rem;
      line-height: 1.35;
      font-weight: 800;
    }
    .title em {
      font-style: normal;
      color: var(--primary);
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .pill {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary-dark);
    }
    .pill.is-done { background: #e7f6ec; }

    .hero {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px 18px;
      margin: 18px 0 14px;
    }
    .hero .kicker {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .hero h2 { font-size: 1.35rem; margin-bottom: 4px; }
    .hero p { color: var(--muted); font-size: 0.9rem; }

    .cta {
      width: 100%;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      border-radius: 14px;
      padding: 16px 18px;
      cursor: pointer;
      margin-top: 16px;
    }
    .cta:active { background: var(--primary-dark); }
    .cta-sub {
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 8px;
    }
    .weak-line {
      font-size: 0.82rem;
      color: var(--muted);
      margin: 14px 0 8px;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--muted);
      margin: 18px 0 8px;
    }
    .unit-row {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .unit-row.is-current { border-color: var(--primary); }
    .unit-row.is-cleared { opacity: 0.78; }
    .unit-mark {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e7f6ec;
      color: var(--primary-dark);
      font-size: 0.72rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .unit-row.is-current .unit-mark { background: var(--primary); color: #fff; }
    .unit-mark:empty { background: #eef3ef; }
    .unit-name { font-weight: 800; font-size: 0.95rem; }
    .unit-meta { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .ghost {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      padding: 8px 0;
    }
    .step-label {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.08em;
    }
    .combo {
      font-size: 0.78rem;
      font-weight: 800;
      color: #b45309;
    }
    .dots {
      display: flex;
      gap: 5px;
      margin: 10px 0 16px;
    }
    .dot {
      flex: 1;
      height: 6px;
      border-radius: 99px;
      background: #d5e0d8;
    }
    .dot.is-done { background: var(--primary); }
    .dot.is-now { background: var(--now); }

    .prompt {
      text-align: center;
      margin: 8px 0 14px;
    }
    .prompt .mystery {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--ink);
    }
    .prompt .en {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.25;
    }
    .prompt .ja {
      margin-top: 8px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--muted);
    }
    .speaker {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .choices { display: grid; gap: 10px; }
    .choice {
      width: 100%;
      text-align: left;
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1.02rem;
      font-weight: 700;
      cursor: pointer;
    }
    .choice.is-ok { background: #e7f6ec; border-color: var(--ok); color: var(--primary-dark); }
    .choice.is-ng { background: #fdecea; border-color: var(--ng); color: #7a1f16; }

    .feedback {
      min-height: 1.4em;
      text-align: center;
      font-weight: 800;
      margin-top: 12px;
    }
    .feedback.ok, .flag.ok { color: var(--ok); }
    .feedback.ng, .flag.ng { color: var(--ng); }
    .flag {
      text-align: center;
      font-size: 0.8rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .example {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      text-align: left;
      margin: 8px 0 16px;
    }
    .example .en { font-weight: 800; font-size: 1.02rem; }
    .example .ja { color: var(--muted); margin-top: 6px; font-size: 0.9rem; }

    #spell-input {
      width: 100%;
      font-size: 1.25rem;
      text-align: center;
      padding: 14px;
      border-radius: 14px;
      border: 2px solid var(--line);
      margin-bottom: 10px;
    }
    .hint-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .hint-btn {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }
    #write-hint {
      text-align: center;
      letter-spacing: 0.12em;
      color: var(--now);
      font-weight: 800;
      min-height: 1.2em;
      margin-bottom: 8px;
    }

    .result-hero { text-align: center; padding: 24px 8px 8px; }
    .result-hero h2 { font-size: 1.5rem; margin: 8px 0; }
    .result-hero p { color: var(--muted); }
    .result-words {
      list-style: none;
      padding: 0;
      margin: 16px 0;
    }
    .result-words li {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: 700;
    }
    .result-words li.ok { border-color: #b7e0c4; }
    .result-words li.ng { border-color: #f5c2bc; }

    .onboard-lead {
      text-align: center;
      margin: 24px 0 18px;
    }
    .onboard-lead p { color: var(--muted); margin-top: 8px; font-size: 0.92rem; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="phone">
    <section id="screen-onboard" hidden>
      <div id="onboard-quiz">
        <p class="brand">中学1年生のための５分英単語</p>
        <div class="onboard-lead">
          <h1 class="title">まず3語だけ</h1>
          <p>知っている語から。毎日5分の準備運動です。</p>
          <p id="onboard-step" class="step-label" style="margin-top:12px;"></p>
        </div>
        <div class="prompt"><div class="en" id="onboard-en"></div></div>
        <div class="choices" id="onboard-options"></div>
      </div>
      <div id="onboard-done" hidden>
        <div class="onboard-lead">
          <h1 class="title">3語、できました</h1>
          <p>きょうから、毎日5分だけ。音からおぼえて、学校の単元へ進みます。</p>
        </div>
        <button type="button" class="cta" id="btn-onboard-go">ホームへ</button>
      </div>
    </section>

    <section id="screen-home" hidden>
      <p class="brand">中学1年生のための</p>
      <h1 class="title"><em>５分</em>英単語</h1>
      <div class="row" style="margin-top:12px;">
        <div class="pill"><span id="streak-num">0</span>日連続</div>
        <div class="pill" id="home-status">きょうはまだ</div>
      </div>
      <div class="hero">
        <div class="kicker">つぎの単元</div>
        <h2 id="next-unit-name">あいさつ</h2>
        <p id="next-unit-blurb">毎日つかうことば</p>
        <button type="button" class="cta" id="cta-main">きょうの5分をはじめる</button>
        <p class="cta-sub" id="cta-sub">1セット 約5分・8語</p>
      </div>
      <p class="weak-line" id="weak-line"></p>
      <div class="section-label">単元</div>
      <div id="unit-list"></div>
    </section>

    <section id="screen-lesson" hidden>
      <div class="topbar">
        <button type="button" class="ghost" id="btn-quit">やめる</button>
        <div class="step-label" id="step-label">きく</div>
        <div class="combo" id="combo-line" hidden></div>
      </div>
      <div class="row" style="justify-content:space-between;">
        <span id="lesson-unit" style="font-weight:800;font-size:0.9rem;"></span>
        <span style="color:var(--muted);font-size:0.8rem;font-weight:700;">
          <span id="lesson-index">1</span> / <span id="lesson-total">8</span>
        </span>
      </div>
      <div class="dots" id="progress-dots"></div>

      <div id="phase-listen">
        <div class="prompt"><div class="mystery">?</div></div>
        <p class="cta-sub" style="margin-top:-6px;margin-bottom:10px;">聞こえた意味は？</p>
        <button type="button" class="speaker" id="btn-replay" aria-label="もう一度聞く">▶</button>
        <div class="choices" id="listen-options"></div>
        <div class="feedback" id="listen-feedback"></div>
      </div>

      <div id="phase-meaning" hidden>
        <div class="flag" id="meaning-flag"></div>
        <div class="prompt">
          <div class="en" id="meaning-en"></div>
          <div class="ja" id="meaning-ja"></div>
        </div>
        <button type="button" class="speaker" id="btn-replay-meaning" aria-label="発音を聞く">▶</button>
        <div class="example">
          <div class="en" id="meaning-ex-en"></div>
          <div class="ja" id="meaning-ex-ja"></div>
        </div>
        <button type="button" class="cta" id="btn-to-write">つづける（書く）</button>
      </div>

      <div id="phase-write" hidden>
        <div class="prompt"><div class="ja" id="write-ja" style="font-size:1.4rem;color:var(--ink);"></div></div>
        <button type="button" class="speaker" id="btn-replay-write" aria-label="発音を聞く">▶</button>
        <input id="spell-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="英語で書く">
        <div class="hint-row">
          <button type="button" class="hint-btn" id="btn-hint">ヒント</button>
        </div>
        <div id="write-hint"></div>
        <div class="feedback" id="write-feedback"></div>
        <button type="button" class="cta" id="btn-write-submit">かくにん</button>
      </div>
    </section>

    <section id="screen-result" hidden>
      <div class="result-hero">
        <p class="brand">きょうの5分</p>
        <h2>おつかれさま</h2>
        <p><span id="result-count">8語</span> やりきりました。</p>
        <p id="result-weak" style="margin-top:8px;"></p>
      </div>
      <ul class="result-words" id="result-words"></ul>
      <button type="button" class="cta" id="btn-result-home">ホームへ</button>
      <p class="cta-sub">習慣は、昨日と同じ儀式から。</p>
      <button type="button" class="ghost" id="btn-result-again" style="width:100%;margin-top:8px;">もう1セット</button>
    </section>
  </div>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function () {});
      });
    }
  </script>
</body>
</html>
